name: Deploy Product

# Reusable build+deploy for a single product family of reference.groupdocs.com.
# Builds with Hugo (theme is vendored in themes/docs — no separate checkout),
# then publishes: staging -> AWS S3 via `hugo deploy` + CloudFront invalidation;
# production -> Ceph S3 via `aws s3 sync` + BunnyCDN purge.
on:
  workflow_call:
    inputs:
      product_family:
        description: 'Product family (e.g. annotation, viewer). Matches config/sites/groupdocs/<product_family>.'
        required: true
        type: string
      environment:
        description: "Target environment: 'production' or 'staging'."
        required: true
        type: string
      invalidate_paths:
        description: 'CDN paths to invalidate/purge (CloudFront on staging, BunnyCDN on production). Defaults to /<product_family>/* /<product_family>.md.'
        required: false
        type: string
        default: ''
      max_deletes:
        description: 'hugo deploy --maxDeletes value (-1 = unlimited).'
        required: false
        type: string
        default: '-1'
      ref:
        description: 'Git ref/branch to build. Empty = the triggering ref (default). Set to "main" for scheduled jobs, which have no meaningful triggering ref.'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy ${{ inputs.product_family }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}    # empty -> triggering ref (deploy_all); set for scheduled branch builds
          fetch-depth: 0    # full history for .GitInfo / .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.101.0'
          extended: true

      - name: Build
        run: hugo --configDir config/sites/groupdocs/${{ inputs.product_family }} --environment ${{ inputs.environment }} --minify

      - name: Resolve relative .md links to absolute (must precede the ugly-URL rename)
        run: python3 scripts/resolve_md_links.py public --base-url "$BASE"
        env:
          # Match the build's .Site.BaseURL: full URL for production, root-relative for staging.
          BASE: ${{ inputs.environment == 'production' && format('https://reference.groupdocs.com/{0}', inputs.product_family) || format('/{0}', inputs.product_family) }}

      - name: Convert .md pretty URLs to ugly (…/x/index.md -> …/x.md)
        run: |
          chmod +x ./scripts/move_md_to_ugly_urls.sh
          ./scripts/move_md_to_ugly_urls.sh public

      # Production = Ceph S3 (reference-groupdocs-com) behind BunnyCDN + nginx-redirector.
      # Staging    = AWS S3 (reference2.groupdocs.com) behind CloudFront (unchanged).
      - name: Publish family Markdown to bucket root as <product>.md
        # The product build's home is the family landing page; serve its .md at
        # /<product>.md (bucket root) instead of /<product>/index.md. Skipped for the
        # `home` build, whose root index.md is the site landing page.
        if: inputs.product_family != 'home'
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            export AWS_ENDPOINT_URL="https://s3-admin.dynabic.com"
            aws s3 cp public/index.md "s3://reference-groupdocs-com/${{ inputs.product_family }}.md" \
              --content-type "text/markdown; charset=utf-8" \
              --endpoint-url https://s3.dynabic.com --acl public-read
          else
            aws s3 cp public/index.md "s3://reference2.groupdocs.com/${{ inputs.product_family }}.md" \
              --content-type "text/markdown; charset=utf-8" --region us-west-2
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ inputs.environment == 'production' && secrets.CEPH_S3_LIVE_ACCESS_KEY || secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.environment == 'production' && secrets.CEPH_S3_LIVE_SECRET_KEY || secrets.SECRET_ACCESS }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Drop the prefixed family Markdown (served at /<product>.md instead)
        # Removing it locally makes the deploy's delete pass remove the old
        # /<product>/index.md from the bucket, so the family .md exists only at the root.
        if: inputs.product_family != 'home'
        run: rm -f public/index.md

      - name: Deploy to S3 (staging, AWS)
        if: inputs.environment != 'production'
        run: hugo --configDir config/sites/groupdocs/${{ inputs.product_family }} --environment ${{ inputs.environment }} deploy --target "Stage" --maxDeletes ${{ inputs.max_deletes }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

      - name: Sync to Ceph S3 (production)
        if: inputs.environment == 'production'
        # `home` publishes to the bucket ROOT, which also holds every product prefix and the
        # root aggregates -> never --delete there (max_deletes '0'). Products own their prefix,
        # so --delete is safe and mirrors `hugo deploy`'s delete pass.
        run: |
          export AWS_ENDPOINT_URL="https://s3-admin.dynabic.com"
          if [ "${{ inputs.product_family }}" = "home" ]; then
            DEST="s3://reference-groupdocs-com/"
          else
            DEST="s3://reference-groupdocs-com/${{ inputs.product_family }}/"
          fi
          DELETE_FLAG="--delete"
          if [ "${{ inputs.max_deletes }}" = "0" ]; then DELETE_FLAG=""; fi
          aws s3 sync ./public/ "$DEST" \
            --endpoint-url https://s3.dynabic.com \
            --acl public-read \
            $DELETE_FLAG
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CEPH_S3_LIVE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CEPH_S3_LIVE_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Invalidate CloudFront (staging)
        if: inputs.environment != 'production'
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.AWS_DISTRIBUTION }}
          PATHS: ${{ inputs.invalidate_paths != '' && inputs.invalidate_paths || format('/{0}/* /{0}.md', inputs.product_family) }}
          AWS_REGION: 'us-west-2'
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

      - name: Purge BunnyCDN Cache (production)
        if: inputs.environment == 'production'
        # One purge per path (Bunny purge takes a single url; wildcards allowed).
        run: |
          set -f   # keep the /<product>/* wildcards literal (no shell globbing)
          PATHS="${{ inputs.invalidate_paths != '' && inputs.invalidate_paths || format('/{0}/* /{0}.md', inputs.product_family) }}"
          for p in $PATHS; do
            curl -siG \
              -H "X-Api-Key: ${{ secrets.BUNNY_API_KEY }}" \
              --data-urlencode "url=https://reference.groupdocs.com$p" \
              "https://api.dynabic.com/bn/purge?async=true"
          done
